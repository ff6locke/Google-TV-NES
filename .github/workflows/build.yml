name: Build GoogleTV Nes APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "GoogleTvNes.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e
          if [ ! -f GoogleTvNes.zip ]; then
            echo "ERROR: GoogleTvNes.zip not found in repo root"
            exit 1
          fi
          unzip -o GoogleTvNes.zip -d extracted
          PROJECT_DIR=$(find extracted -maxdepth 3 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found in extracted zip"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Repair and Clean build.gradle
        run: |
          set -e
          if [ -f app/build.gradle ]; then
            FILE=app/build.gradle
          elif [ -f build.gradle ]; then
            FILE=build.gradle
          else
            echo "No build file to clean."
            exit 0
          fi
          
          python3 - "$FILE" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path).read()
          clean_src = re.sub(r'tasks\.withType\(org\..*?\}\s*\}', '', src, flags=re.S)
          clean_src = re.sub(r'tasks\.withType\(org\..*?\}', '', clean_src, flags=re.S)
          clean_src = re.sub(r'kotlinOptions\s*\{.*?\}', '', clean_src, flags=re.S)
          open(path, 'w').write(clean_src)
          PY
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Patch EmuActivity Java Lambda Variable Clash
        run: |
          set -e
          
          # Dynamically search for EmuActivity.java anywhere inside the project
          FILE=$(find . -type f -name "EmuActivity.java" | head -n 1)
          
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "WARNING: EmuActivity.java could not be found automatically."
            exit 0
          fi
          
          echo "Patching lambda naming conflict inside: $FILE"
          
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()

          # Replace the specific clashing variable assignment inside OnLayoutChangeListener
          old_lambda = "v, l, t, r, b, ol, ot, or, ob"
          new_lambda = "v, l, t, r, bottom, ol, ot, or, ob"
          
          if old_lambda in src:
              src = src.replace(old_lambda, new_lambda)
              print("Successfully renamed lambda parameter 'b' to 'bottom'")
          else:
              print("Target lambda signature not matched or already patched")
              
          open(path, 'w').write(src)
          PY
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Patch InputMap.kt JVM clash
        run: |
          set -e
          FILE=$(grep -rl 'fun setAssist' . | grep '\.kt$' | head -n 1)
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            exit 0
          fi
          
          python3 - "$FILE" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path).read()
          if 'import kotlin.jvm.JvmName' not in src:
              m = re.search(r'^package\s+\S+\s*$', src, flags=re.M)
              if m:
                  src = src[:m.end()] + '\nimport kotlin.jvm.JvmName\n' + src[m.end():]
          pattern = re.compile(r'(\n\s*)(fun\s+setAssist\s*\(\s*\w+\s*:\s*Boolean\s*\))')
          new_src, n = pattern.subn(r'\1@JvmName("applyAssist")\1\2', src)
          open(path, 'w').write(new_src)
          PY
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        run: |
          gradle assembleDebug \
            -Dorg.gradle.java.home=$JAVA_HOME \
            -Pandroid.kotlinOptions.jvmTarget=17
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTvNes-Android-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
